<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Redirecting — Leah Nicolich</title>
    <script>
      const legacy = {
        '/paintings': '/paintings',
        '/drawings': '/drawings',
        '/sculptures': '/sculptures',
        '/pastprojects': '/past-projects',
        '/exhibitions': '/about',
        '/artist-statement': '/about',
        '/news/links': '/news',
        '/contact': '/contact'
      };
      const route = legacy[location.pathname] || '/';
      location.replace('/#' + route);
    </script>
  </head>
  <body></body>
</html>
